name: npm publish

# Publishes @drakulavich/ottoman on tag push (vX.Y.Z). Requires the NPM_TOKEN
# repo secret (granular token, read+write on the package).
# No --provenance: sigstore's public-good instance only attests public repos;
# this repo is private. Add the flag if the repo ever goes public.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run check

      - name: Verify tag matches package.json version
        if: github.event_name == 'push'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(jq -r .version package.json)"
          if [ "$TAG" != "$PKG" ]; then
            echo "tag v$TAG != package.json $PKG — bump the version before tagging" >&2
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Publish (idempotent, prerelease -> beta dist-tag)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          PKG_NAME="$(jq -r .name package.json)"
          PKG_VERSION="$(jq -r .version package.json)"
          if npm view "$PKG_NAME@$PKG_VERSION" version >/dev/null 2>&1; then
            echo "$PKG_NAME@$PKG_VERSION already on npm — skipping (safe rerun)"
            exit 0
          fi
          case "$PKG_VERSION" in
            *-*) DIST_TAG=beta ;;
            *)   DIST_TAG=latest ;;
          esac
          # access comes from publishConfig in package.json
          npm publish --tag "$DIST_TAG"
